[project]
name = "vocinsights"
version = "1.0.0"
description = "Voice of customer analytics: themes, aspect sentiment, emerging issues, NPS drivers, and a quarterly insights report from survey comments, app reviews, and support tickets."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
vocinsights = "vocinsights.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocinsights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
